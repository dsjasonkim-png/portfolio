<svg width="100%" viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" role="img">
<title>상품 라이프사이클 5단계 개요</title>
<desc>상품 기획·도입에서 SKU 단위 리오더, 물류센터 재고 기반 점포 보충, 물류센터 재고 부족 시 점포 간 재배치, Exit·반품까지 이어지는 5단계 의사결정 흐름</desc>
<defs><marker id="lc5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="760" height="210" fill="#ffffff"></rect>

<g><rect x="15" y="70" width="130" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"></rect><text x="80" y="93" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#26215C">1. 기획·도입</text><text x="80" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">SKU 총수요 예측</text><text x="80" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">초기 배분 최적화</text></g>

<g><rect x="162" y="70" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="227" y="93" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">2. 리오더</text><text x="227" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">SKU 단위 (점포 무관)</text><text x="227" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">추가 생산·발주 판단</text></g>

<g><rect x="309" y="70" width="130" height="80" rx="8" fill="#FFF6E3" stroke="#A76500" stroke-width="0.5"></rect><text x="374" y="93" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#7A4B00">3. 재고보충</text><text x="374" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#A76500">DC 재고 有 시</text><text x="374" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#A76500">DC→점포 배분</text></g>

<g><rect x="456" y="70" width="130" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"></rect><text x="521" y="93" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#712B13">4. 점포 간 재배치</text><text x="521" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#993C1D">DC 재고 부족 시</text><text x="521" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#993C1D">Transportation 모델</text></g>

<g><rect x="603" y="70" width="130" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="668" y="93" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">5. Exit·재고소진</text><text x="668" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">Bass·Elbow 탐지</text><text x="668" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">반품 스케줄링</text></g>

<line x1="145" y1="110" x2="162" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#lc5)"></line>
<line x1="292" y1="110" x2="309" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#lc5)"></line>
<line x1="439" y1="110" x2="456" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#lc5)"></line>
<line x1="586" y1="110" x2="603" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#lc5)"></line>

<text x="380" y="185" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#8A8983">3·4는 같은 상황(점포 재고 부족)을 물류센터 재고 유무로 분기 처리 — 재고보충(DC→점포) / 재배치(점포↔점포)</text>
</svg>
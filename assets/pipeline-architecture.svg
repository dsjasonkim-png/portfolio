<g><rect x="350" y="60" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="415" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">LLM 정제</text><text x="415" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">속성 구조화</text></g>
<g><rect x="500" y="60" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="565" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">검증 Agent</text><text x="565" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">원문 대조·검증</text></g>

<g><rect x="210" y="338" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">통합 조회·검증 화면</text><text x="340" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">운영자 UI</text></g>

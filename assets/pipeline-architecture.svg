<g><rect x="350" y="156" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="415" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">LLM 정제</text><text x="415" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">항목별 정리</text></g>

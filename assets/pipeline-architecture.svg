<svg width="100%" viewBox="0 0 680 434" xmlns="http://www.w3.org/2000/svg" role="img">
<title>상품정보 자동화 파이프라인 아키텍처</title>
<desc>속성 추출과 고시정보 추출 두 파이프라인이 OCR과 LLM 정제, 검증 단계를 거쳐 DB에 적재되고 통합 조회·검증 화면으로 모이는 구조</desc>
<defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="434" fill="#ffffff"/>

<text x="50" y="48" font-family="sans-serif" font-size="12" fill="#5F5E5A">속성 추출</text>

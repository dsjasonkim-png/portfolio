<path d="M565,212 L565,225 L300,225 L300,252" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow1)"/>

<g><rect x="265" y="252" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="272" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">DB 적재</text><text x="340" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">정형 데이터 저장</text></g>


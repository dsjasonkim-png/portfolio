<line x1="330" y1="88" x2="350" y2="88" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow1)"/>
<line x1="480" y1="88" x2="500" y2="88" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow1)"/>


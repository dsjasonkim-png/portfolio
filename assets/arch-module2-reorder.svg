<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>모듈 2 — 리오더 최적화 아키텍처 (SKU 단위)</title>
<desc>점포 구분 없이 SKU 전체 판매실적과 총 가용재고를 기반으로 향후 수요를 예측하고, 총재고 대비 부족분을 산정해 추가 생산·발주 시점과 수량을 결정하는 구조</desc>
<defs><marker id="m2b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="260" fill="#ffffff"></rect>

<g><rect x="20" y="70" width="150" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="95" y="95" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">SKU 전체 판매실적</text><text x="95" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">전 점포 합산 기준</text><text x="95" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8983">점포 구분 없음</text></g>

<g><rect x="190" y="70" width="150" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="265" y="95" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">SKU 단위 수요예측</text><text x="265" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">향후 주차 총수요</text><text x="265" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#3E9C82">Time Series</text></g>

<g><rect x="360" y="70" width="150" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="435" y="95" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">총재고 대비 부족분</text><text x="435" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">DC+전 점포 가용재고</text><text x="435" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#3E9C82">Gap Analysis</text></g>

<g><rect x="530" y="70" width="130" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"></rect><text x="595" y="95" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#712B13">추가 생산·발주</text><text x="595" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#993C1D">시점·수량 결정</text><text x="595" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#B65C36">Reorder Point</text></g>

<line x1="170" y1="110" x2="190" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m2b)"></line>
<line x1="340" y1="110" x2="360" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m2b)"></line>
<line x1="510" y1="110" x2="530" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m2b)"></line>

<text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8983">모델링 단위: SKU (점포 축 없음) — 결과는 리드타임 반영 후 생산·발주 부서로 전달</text>
<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#8A8983">이후 확보된 물량은 모듈 3(재고보충)·모듈 4(재배치)로 점포 단위 배분</text>
</svg>
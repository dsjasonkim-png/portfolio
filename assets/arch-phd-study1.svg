<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Study 1 — OCR-LLM 기반 판매논리 자동 생성 파이프라인</title>
<desc>상세페이지 이미지가 텍스트 추출 모듈(전처리·검출·분할·OCR)을 거쳐 LCORE로 문맥 정제되고, 판매논리 생성 LLM이 FAB 구조와 SONCAS 구매동기를 부여해 구조화된 판매지식을 만드는 구조</desc>
<defs><marker id="ps1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="260" fill="#ffffff"></rect>

<g><rect x="15" y="75" width="120" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="75" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#444441">상세페이지</text><text x="75" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#444441">이미지</text><text x="75" y="133" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8983">세로형·고해상도</text></g>

<g><rect x="150" y="65" width="160" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"></rect><text x="230" y="88" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#26215C">텍스트 추출 모듈</text><text x="230" y="106" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">CLAHE 전처리</text><text x="230" y="122" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">CRAFT 검출·분할</text><text x="230" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#6A61C9">EasyOCR (CRNN)</text></g>

<g><rect x="330" y="65" width="150" height="100" rx="8" fill="#FFF6E3" stroke="#A76500" stroke-width="0.5"></rect><text x="405" y="88" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7A4B00">LCORE</text><text x="405" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A76500">품목·상품명 조건</text><text x="405" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A76500">맞춤법·문맥 정제</text><text x="405" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#B65C36">원문 범위 내 사실성 유지</text></g>

<g><rect x="500" y="65" width="165" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="582" y="88" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">판매논리 생성 LLM</text><text x="582" y="106" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">Feature·Advantage·Benefit</text><text x="582" y="122" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">SONCAS 복수 태깅</text><text x="582" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#3E9C82">구조화된 판매지식</text></g>


<text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8983">핵심 설계: 텍스트 검출 위치 기준 이미지 분할로 긴 상세페이지의 OCR 입력 크기 문제 완화</text>
<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8983">CPU 기반 OCR 오류를 LLM이 상품 문맥에 맞게 정제 → FAB·SONCAS로 변환</text>

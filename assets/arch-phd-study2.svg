<g><rect x="280" y="60" width="120" height="75" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="340" y="90" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#085041">시맨틱 검색</text><text x="340" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0F6E56">설득형 지식 검색</text></g>

<g><rect x="415" y="60" width="120" height="75" rx="8" fill="#FFF6E3" stroke="#A76500" stroke-width="0.5"></rect><text x="475" y="90" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#7A4B00">재정렬 모듈</text><text x="475" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A76500">후보 우선순위</text></g>

<g><rect x="550" y="60" width="120" height="75" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"></rect><text x="610" y="90" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#712B13">응답 생성기</text><text x="610" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#993C1D">설명형 추천 응답</text></g>


<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Study 2 — 설득형 지식 기반 상품 추천 AI 에이전트 구조</title>
<desc>사용자 자연어 질의가 질의 해석기에서 의도·상황·맥락으로 해석되고, 설득형 지식 기반 시맨틱 검색과 재정렬을 거쳐 설명형 추천 응답을 생성하며, 대화 메모리가 맥락을 유지하는 구조</desc>
<defs><marker id="ps2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="260" fill="#ffffff"></rect>


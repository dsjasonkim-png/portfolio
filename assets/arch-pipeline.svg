<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>상품정보 자동화·검증 파이프라인 아키텍처</title>
<desc>속성 추출과 고시정보 추출 두 파이프라인이 OCR과 LLM 정제, 다단계 검증 Agent를 거쳐 DB에 적재되고, 검증 결과의 오류 유형이 Prompt/Rule 개선 Feedback Loop로 되돌아가는 구조</desc>
<defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
<marker id="arrowFb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B65C36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="480" fill="#ffffff"></rect>



<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>모듈 3 — 재고보충 최적화 아키텍처 (물류센터 재고 활용)</title>
<desc>물류센터 가용재고가 있는 상황에서 점포별 부족 SKU를 진단하고 우선순위에 따라 물류센터에서 점포로 재고를 배분하는 구조</desc>
<defs><marker id="m3b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="300" fill="#ffffff"></rect>

<g><rect x="250" y="20" width="180" height="40" rx="20" fill="#FFF6E3" stroke="#A76500" stroke-width="0.7"></rect><text x="340" y="45" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7A4B00">전제조건: 물류센터 가용재고 有</text></g>

<g><rect x="20" y="100" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="95" y="125" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">물류센터 가용재고</text><text x="95" y="142" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">SKU별 보유량</text></g>

<g><rect x="190" y="100" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="265" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">점포별 부족 SKU</text><text x="265" y="139" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">진단(인시즌 수요예측)</text><text x="265" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#3E9C82">모듈 2 예측 공유</text></g>

<g><rect x="360" y="100" width="150" height="70" rx="8" fill="#FFF6E3" stroke="#A76500" stroke-width="0.5"></rect><text x="435" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#7A4B00">보충 우선순위 산정</text><text x="435" y="139" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#A76500">긴급도·판매기여도</text><text x="435" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#B65C36">Priority Ranking</text></g>

<g><rect x="530" y="100" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="595" y="125" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">DC→점포 배분</text><text x="595" y="142" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">점포별 보충계획</text></g>

<line x1="170" y1="135" x2="190" y2="135" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m3b)"></line>
<line x1="340" y1="135" x2="360" y2="135" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m3b)"></line>
<line x1="510" y1="135" x2="530" y2="135" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m3b)"></line>
<line x1="340" y1="60" x2="340" y2="100" stroke="#A76500" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#m3b)"></line>

<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8983">모델링 단위: 물류센터 × 점포 × SKU</text>
<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#8A8983">물류센터 재고가 부족한 SKU·점포 조합은 모듈 4(점포 간 재배치)로 분기</text>
</svg>
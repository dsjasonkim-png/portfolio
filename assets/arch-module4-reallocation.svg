<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>모듈 4 — 점포 간 재고 배분 및 재배치 최적화 아키텍처</title>
<desc>물류센터 재고가 부족한 상황에서 공급 가능 점포와 부족 예상 점포를 진단하고, Transportation 모델의 의사결정변수·제약조건·목적함수를 통해 점포·SKU별 이동계획을 생성하는 구조</desc>
<defs><marker id="m4c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="300" fill="#ffffff"></rect>

<g><rect x="250" y="8" width="180" height="34" rx="17" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"></rect><text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#712B13">전제조건: 물류센터 재고 부족</text></g>

<g><rect x="20" y="60" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="95" y="83" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#085041">공급 가능 점포</text><text x="95" y="100" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">예상 과잉재고</text></g>
<g><rect x="20" y="140" width="150" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"></rect><text x="95" y="163" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#712B13">부족 예상 점포</text><text x="95" y="180" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#993C1D">예상 결품·미충족</text></g>

<g><rect x="215" y="100" width="170" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="300" y="123" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">과부족 재고 진단</text><text x="300" y="140" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">공급가능량 · 필요이동량</text><text x="300" y="156" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A8983">미래 재고 포지션</text></g>


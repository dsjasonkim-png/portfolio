<path d="M200,90 L200,135 L215,135" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m4c)"></path>
<line x1="170" y1="170" x2="200" y2="170" stroke="#5F5E5A" stroke-width="1"></line>
<path d="M200,170 L200,135 L215,135" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#m4c)"></path>

<g><rect x="430" y="80" width="230" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"></rect><text x="545" y="105" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#26215C">Transportation 모델</text><text x="545" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">의사결정변수: 출발×도착×SKU 이동량</text><text x="545" y="144" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">제약: 공급량 ≤ 가능재고</text><text x="545" y="160" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">제약: 수요량 ≤ 부족수량</text><text x="545" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">목적: 결품 최소화·판매 최대화</text><text x="545" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#6A61C9">Linear Programming (LP)</text></g>

<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>End-to-End 연구 프레임워크</title>
<desc>멀티모달 상품정보가 Study 1의 OCR-LLM 판매논리 자동생성을 거쳐 설득형 지식베이스로 구조화되고, Study 2의 상품 추천 AI 에이전트에서 검색·추천에 활용되는 전체 흐름</desc>
<defs><marker id="pe1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<rect width="680" height="260" fill="#ffffff"></rect>

<g><rect x="15" y="70" width="140" height="90" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect><text x="85" y="100" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#444441">멀티모달 상품정보</text><text x="85" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">상세페이지 이미지</text><text x="85" y="134" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">상품 속성·설명</text></g>

<g><rect x="185" y="55" width="180" height="120" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"></rect><text x="275" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#26215C">Study 1</text><text x="275" y="97" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">OCR–LLM 판매논리 생성</text><text x="275" y="116" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">전처리·분할·OCR</text><text x="275" y="132" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">LCORE 문맥 정제</text><text x="275" y="148" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">FAB 생성 + SONCAS</text></g>

<g><rect x="395" y="55" width="150" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect><text x="470" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#085041">설득형 지식베이스</text><text x="470" y="100" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">상품속성 + FABEC</text><text x="470" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">SONCAS 구매동기</text><text x="470" y="136" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">Meta Store</text><text x="470" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0F6E56">Vector Index</text></g>

<g><rect x="565" y="70" width="105" height="90" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"></rect><text x="617" y="93" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#712B13">Study 2</text><text x="617" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#993C1D">질의해석·검색</text><text x="617" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#993C1D">재정렬·응답</text></g>

<line x1="155" y1="110" x2="180" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#pe1)"></line>
<line x1="365" y1="110" x2="390" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#pe1)"></line>
<line x1="545" y1="110" x2="560" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#pe1)"></line>

<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#8A8983">비정형 상품정보 → 판매 설명 지식 → 검색 가능한 지식 표현 → 사용 맥락 기반 추천·응답</text>
</svg>